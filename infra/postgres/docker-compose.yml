services:
  postgres:
    image: postgres:16
    container_name: jaffle-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: jaffle_app
      POSTGRES_USER: app_owner
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_replication_slots=4
      - -c
      - max_wal_senders=4

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro

    networks:
      - jaffle_net

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app_owner -d jaffle_app"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:

networks:
  jaffle_net:
    name: jaffle_net
